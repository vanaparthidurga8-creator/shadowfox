<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>V. Durga | Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#f4f6f9;
    color:#333;
    line-height:1.6;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    color:white;
    padding:60px 20px;
    text-align:center;
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    margin-bottom:20px;
}

header h1{
    font-size:42px;
}

header p{
    font-size:20px;
    margin-top:10px;
}

/* NAVBAR */

nav{
    background:#111827;
    padding:15px;
    position:sticky;
    top:0;
    z-index:1000;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
    flex-wrap:wrap;
}

nav ul li{
    margin:10px 20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav ul li a:hover{
    color:#ffd43b;
}

/* SECTIONS */

section{
    padding:60px 20px;
    max-width:1100px;
    margin:auto;
}

h2{
    color:#0d6efd;
    margin-bottom:25px;
    display:inline-block;
    border-bottom:3px solid #0d
